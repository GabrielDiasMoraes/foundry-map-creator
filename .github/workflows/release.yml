name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version and download URL
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${GITHUB_REF_NAME#v}\"/" module.json
          sed -i "s#\"download\": \".*\"#\"download\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip\"#" module.json
      - run: zip -r module.zip module.json scripts styles templates lang LICENSE README.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
